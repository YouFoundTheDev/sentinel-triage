[project]
name = "soc-triage-agent"
version = "0.1.0"
description = "SOC alert triage agent on Google Cloud"
readme = "README.md"
requires-python = ">=3.11,<3.14"
dependencies = [
    "dnspython>=2.6.0",
    "fastapi>=0.115.0",
    "google-adk>=2.13.0,<3.0.0",
    "google-cloud-bigquery>=3.25.0",
    "httpx>=0.27.0",
    "pydantic>=2.8.0",
    "pydantic-settings>=2.4.0",
    "python-dotenv>=1.0.0",
    "tldextract>=5.1.0",
    "uvicorn>=0.30.0",
]

[dependency-groups]
dev = [
    "pytest>=8.2.0",
    "ruff>=0.6.0",
]

[tool.uv]
package = false

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.ruff.lint.isort]
known-first-party = ["agent", "api", "config", "data", "tools"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q"
